# Docker Compose: PostgreSQL + card-scanner backend.
#
# The frontend is run separately with `npm run dev` (its Vite dev server proxies
# /api and /cards to this backend).
services:
  db:
    image: postgres:16
    container_name: card-scanner-db
    environment:
      POSTGRES_USER: cardscanner
      POSTGRES_PASSWORD: cardscanner
      POSTGRES_DB: cardscanner
    volumes:
      # Postgres data on a named volume (VM-native fs). Persists across
      # down/up; cleared only by `docker compose down -v`.
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Backend waits until Postgres is actually accepting connections.
      test: ["CMD-SHELL", "pg_isready -U cardscanner -d cardscanner"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: card-scanner-backend
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      # De-skewed crops + the index error log: bind-mounted so they're easy to inspect.
      - ./data/cards:/data/cards
    environment:
      CARDS_DIR: /data/cards
      DATABASE_URL: postgresql://cardscanner:cardscanner@db:5432/cardscanner
    restart: unless-stopped

volumes:
  pgdata:
